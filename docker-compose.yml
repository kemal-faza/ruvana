services:
  db:
    image: postgres:16
    container_name: ruvana-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruvana}
      POSTGRES_USER: ${POSTGRES_USER:-ruvana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruvana_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruvana} -d ${POSTGRES_DB:-ruvana}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
