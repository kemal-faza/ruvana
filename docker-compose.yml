services:
  db:
    image: postgres:16
    container_name: ruvana-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruvana}
      POSTGRES_USER: ${POSTGRES_USER:-ruvana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruvana_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruvana} -d ${POSTGRES_DB:-ruvana}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Inisialisasi otomatis Modul 4: begitu PostgreSQL sehat, jalankan migrasi +
  # seed (termasuk laporan demo) persis sekali. Seed idempoten sehingga aman
  # dipicu ulang, termasuk setelah volume db di-reset.
  db-init:
    image: ruvana-db-init
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ruvana}:${POSTGRES_PASSWORD:-ruvana_pass}@db:5432/${POSTGRES_DB:-ruvana}
    restart: "no"

volumes:
  db_data:
