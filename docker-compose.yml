services:
  db:
    image: postgres:16
    container_name: ruvana-db
    restart: unless-stopped
    # Dev lokal (podman rootless) di mesin pengembang:
    # - network_mode host menghindari kegagalan netns Pasta di mesin ini;
    #   Postgres listen di localhost:5432 (lihat env POSTGRES_PORT).
    # - tmpfs untuk PGDATA: repo & volume podman berada di /mnt/DATA yang adalah
    #   fuseblk (NTFS, tanpa dukungan chmod/ownership Unix) sehingga initdb
    #   postgres gagal; bind btrfs /home juga gagal chown di rootless podman.
    #   Data EPHEMERAL (hilang saat container down) — migrasi + seed idempoten
    #   bisa dijalankan ulang kapan saja. Untuk persistensi, arahkan volume ke
    #   filesystem Linux native (mis. bind mount ext4/btrfs yang proper).
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruvana}
      POSTGRES_USER: ${POSTGRES_USER:-ruvana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruvana_pass}
      # /var/run pada overlay (fuseblk) tidak bisa chmod oleh postgres → mount
      # tmpfs di /var/run/postgresql agar Unix socket default bisa dibuat.
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1g,noexec,nosuid
      - /var/run/postgresql:rw,size=16m,noexec,nosuid
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruvana} -d ${POSTGRES_DB:-ruvana}"]
      interval: 5s
      timeout: 5s
      retries: 10
