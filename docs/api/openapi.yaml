  /api/admin/facilities/{facilityId}:
    get:
      operationId: getAdminFacility
      tags: [Administration]
      summary: Menampilkan detail fasilitas admin
      description: Hanya role=admin dengan status=ACTIVE yang diterima; akun non-ACTIVE menghasilkan 401 generik, sedangkan principal ACTIVE dengan role berbeda menghasilkan 403. Admin dapat melihat status dan metadata fasilitas termasuk INACTIVE.
      x-requirement-ids: [FAC-05, IAM-03]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Detail fasilitas administrasi.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
              example: { id: 1, nama: RK-101, tipe: ruang_kelas, lokasi: Gedung A Lt.1, kapasitas: 40, deskripsi: Ruang kelas standar ber-AC, status: ACTIVE, statusChangedAt: null, statusChangedBy: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateFacility
      tags: [Administration]
      summary: Memperbarui atau menonaktifkan fasilitas
      description: >-
          Hanya role admin dengan status ACTIVE yang diterima; akun dengan status selain
          ACTIVE selalu menghasilkan 401 generik, sedangkan principal ACTIVE dengan role
          berbeda menghasilkan 403. Matriks transisi admin yang valid tepat:
          ACTIVE -> UNDER_MAINTENANCE, UNDER_MAINTENANCE -> ACTIVE, ACTIVE -> INACTIVE,
          INACTIVE -> ACTIVE, dan UNDER_MAINTENANCE -> INACTIVE; transisi lain ditolak.
          Petugas hanya boleh ACTIVE <-> UNDER_MAINTENANCE dan tidak pernah boleh
          menangani INACTIVE. Hanya destination UNDER_MAINTENANCE yang memanggil
          REP-04/RES-09 dengan transaksi atomik yang sama: statusChangedBy adalah admin
          terbaru, statusChangedAt adalah satu timestamp server bersama, tepat reservasi
          APPROVED pada facility ini dengan startsAt > statusChangedAt dibatalkan dengan
          alasan otomatis yang terlihat user. Retry idempotent, reservation lampau/facility
          lain terlindungi, rollback berlaku bila efek gagal, dan destination ACTIVE
           menghitung ulang availability dari APPROVED terkini. Untuk setiap perubahan
           status, sebelum mengembalikan 200 server wajib invalidate seluruh representasi
           public list/detail/availability yang terdampak; client wajib refetch representasi
           tersebut. Minimal satu field wajib dikirim; tidak ada operasi DELETE dan nama
           tetap unik.
      x-requirement-ids: [FAC-05, FAC-04, REP-04, RES-09, IAM-03]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityUpdateRequest' }
            example: { deskripsi: Ruang kelas standar dengan proyektor baru. }
      responses:
        '200':
          description: >-
            Fasilitas terbaru; seluruh representasi public list/detail/availability
            yang terdampak telah di-invalidate sebelum 200 dikembalikan bila status
            berubah.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
              example: { id: 1, nama: RK-101, tipe: ruang_kelas, lokasi: Gedung A Lt.1, kapasitas: 40, deskripsi: Ruang kelas standar dengan proyektor baru., status: ACTIVE, statusChangedAt: null, statusChangedBy: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MutationForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FacilityMutationConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [Analytics]
      summary: Menampilkan dashboard analitik
      description: >-
        Hanya role=admin dengan status=ACTIVE yang diterima; akun non-ACTIVE
        menghasilkan 401 generik, sedangkan principal ACTIVE dengan role berbeda
        menghasilkan 403. Admin wajib mengirim rentang tanggal inklusif dalam Asia/Jakarta dengan
        dateFrom <= dateTo. Server memakai rentang UTC setengah-terbuka dari 00:00
        awal sampai 00:00 sehari setelah dateTo. Location dinormalisasi dengan trim
        dan case-fold lalu dicocokkan exact secara case-insensitive; location kosong
         berarti seluruh lokasi. Dashboard dan export memakai population setiap fasilitas
         yang cocok: ACTIVE, UNDER_MAINTENANCE, dan INACTIVE semuanya termasuk dalam
         denominator. Frekuensi kerusakan sama dengan laporan yang createdAt-nya berada
         dalam effective range dan dikelompokkan berdasarkan fasilitas, kategori, dan status.
         Numerator hanya menit APPROVED; denominator = setiap fasilitas yang cocok dengan
         location ternormalisasi × jumlah hari × 780 menit. Keterbatasan historis: populasi
         fasilitas memakai katalog/status saat perhitungan dan tidak merekonstruksi riwayat
         status fasilitas.
      x-requirement-ids: [ANA-01, IAM-03]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/AnalyticsLocation'
      responses:
        '200':
          description: Rekap analitik; keadaan tanpa data tetap berisi nilai nol dan metodologi.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
              example:
                filter: { dateFrom: '2026-09-01', dateTo: '2026-09-30', location: Gedung A }
                timezone: Asia/Jakarta
                effectiveRange: { from: '2026-08-31T17:00:00Z', until: '2026-09-30T17:00:00Z' }
                generatedAt: '2026-10-01T02:00:00Z'
                occupancy: { numeratorMinutes: 1560, denominatorMinutes: 23400, percentage: 6.6667 }
                damageGroups:
                  - facilityId: 1
                    facilityName: RK-101
                    kategori: Listrik
                    status: RESOLVED
                    count: 2
                methodology: { operatingMinutesPerDay: 780, approvedOnly: true, maintenanceExcludedFromDenominator: false, damageCountedFrom: createdAt }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/admin/analytics/export:
    get:
      operationId: exportAdminAnalytics
      tags: [Analytics]
      summary: Mengekspor rekap analitik
      description: >-
        Hanya role=admin dengan status=ACTIVE yang diterima; akun non-ACTIVE
        menghasilkan 401 generik, sedangkan principal ACTIVE dengan role berbeda
        menghasilkan 403. Menggunakan dataset dan filter efektif yang sama persis dengan dashboard,
        termasuk setiap fasilitas yang cocok, termasuk ACTIVE, UNDER_MAINTENANCE,
        dan INACTIVE, normalized case-insensitive exact location match, effective UTC range,
        numerator, denominator, damage groups, dan methodology. File wajib memuat
        period dateFrom/dateTo, requested serta effective location/filter, generatedAt,
        methodology, dan dataset yang sama. Mapping tepat: format=csv -> text/csv dan
        ekstensi .csv; format=xlsx -> application/vnd.openxmlformats-officedocument
        .spreadsheetml.sheet dan ekstensi .xlsx; format=pdf -> application/pdf dan
        ekstensi .pdf. CSV/XLSX menetralkan nilai cell yang diawali =, +, -, @, tab,
        atau carriage return dengan prefix apostrophe sebelum serialisasi. PDF memakai
        text encoding UTF-8/font yang aman serta escaping backslash, parentheses, dan
        control bytes; input diperlakukan sebagai data, bukan markup/kode. Ekspor
        kosong tetap memiliki header, periode, filter, generatedAt, metodologi, dan
        file valid. Content-Disposition memuat rentang tanggal.
      x-requirement-ids: [ANA-02, ANA-01, IAM-03]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/AnalyticsLocation'
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: File ekspor valid dengan dataset yang konsisten terhadap dashboard.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ExportContentDisposition'
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            text/csv:
              schema: { type: string, format: binary }
              example: |
                section,field,value
                period,dateFrom,2026-09-01
                period,dateTo,2026-09-30
                period,effectiveFrom,2026-08-31T17:00:00Z
                period,effectiveUntil,2026-09-30T17:00:00Z
                filter,requestedLocation,Gedung A
                filter,normalizedLocation,gedung a
                filter,effectiveLocation,gedung a
                filter,locationMatch,exact case-insensitive
                filter,effectiveDateFrom,2026-08-31T17:00:00Z
                filter,effectiveDateUntil,2026-09-30T17:00:00Z
                metadata,timezone,Asia/Jakarta
                metadata,generatedAt,2026-10-01T02:00:00Z
                methodology,operatingMinutesPerDay,780
                methodology,approvedOnly,true
                methodology,maintenanceExcludedFromDenominator,false
                methodology,damageCountedFrom,createdAt
                section,Occupancy dataset,
                recordType,facilityId,facilityName,facilityStatus,numeratorMinutes,denominatorMinutes,percentage
                facility,1,RK-101,ACTIVE,1560,23400,6.6667
                total,,,,1560,23400,6.6667
                section,Damage frequency dataset,
                facilityId,facilityName,kategori,status,count
                1,RK-101,Listrik,RESOLVED,2
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ruvana_session
      description: Cookie sesi persisten HttpOnly, SameSite=Lax, Secure di production, Path=/, dengan expiry server dan lifetime bounded yang dikonfigurasi implementasi (durasi tidak ditetapkan oleh kontrak ini).
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: >-
        Header harus hadir tepat satu kali. Server menolak missing, malformed,
        nilai literal null, dan multiple Origin values dengan 403
        CSRF_ORIGIN_REJECTED. Nilai yang valid dibandingkan tanpa normalisasi
        terhadap allowlist menggunakan exact scheme+host+port; path, query,
        fragment, dan wildcard tidak diterima.
      schema: { type: string, format: uri, maxLength: 2048 }
      example: https://app.example.invalid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID untuk operasi yang mendeklarasikan header ini, dengan identity
        authenticated principal + HTTP method/operation ID + canonical path
        parameters + relevant query + canonical body; retensi 24 jam. Urutan
        wajib adalah authenticate -> verifikasi akun ACTIVE dan otorisasi role
        -> verifikasi ownership bila berlaku -> validasi Origin ->
        idempotency lookup/storage -> operasi bisnis. Key/payload sama menunggu
        request pertama lalu mengembalikan status/body yang sama; payload berbeda
        menghasilkan 409 IDEMPOTENCY_KEY_REUSED. Request bersamaan dengan identity
        sama hanya menjalankan satu efek. Hanya hasil deterministik yang
        didokumentasikan oleh operasi yang boleh dipersist atau di-replay; 401,
        403, dan Origin yang ditolak tidak pernah dipersist atau di-replay, serta
        tidak mengonsumsi key. Status 200, 201, 204, dan 4xx deterministik yang
        didokumentasikan dapat dipersist; 5xx, 429, 502, dan 503 tidak dipersist.
        Canonical path binding mencegah replay lintas resource.
      schema: { type: string, format: uuid }
      example: 2c1f4a3e-7e71-4d5c-9f1c-0f0d9e5f1a11
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman, dimulai dari 1.
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    PerPage:
      name: perPage
      in: query
      required: false
      description: Jumlah item per halaman.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    Search:
      name: search
      in: query
      required: false
      description: Kata kunci pencarian.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: lab
    PublicLocation:
      name: location
      in: query
      required: false
      description: Filter discovery fasilitas publik. Nilai dinormalisasi dengan trim dan Unicode-aware casefold, lalu dicocokkan substring secara case-insensitive pada lokasi tersimpan.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: Gedung A
    AdminLocation:
      name: location
      in: query
      required: false
      description: Filter fasilitas admin. Nilai dinormalisasi dengan trim dan Unicode-aware casefold, lalu dicocokkan substring secara case-insensitive pada lokasi tersimpan.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: Gedung A
    AnalyticsLocation:
      name: location
      in: query
      required: false
      description: Filter analytics opsional. Nilai dinormalisasi dengan trim dan Unicode-aware casefold, lalu dicocokkan exact secara case-insensitive; omission atau null berarti semua lokasi.
      schema: { type: [string, 'null'], maxLength: 200 }
      example: Gedung A
    MinCapacity:
      name: minCapacity
      in: query
      required: false
      description: Kapasitas minimum positif.
      schema: { type: integer, minimum: 1 }
      example: 30
    FacilityTypeQuery:
      name: type
      in: query
      required: false
      description: Filter tipe fasilitas.
      schema: { $ref: '#/components/schemas/FacilityType' }
      example: laboratorium
    FacilityStatusQuery:
      name: status
      in: query
      required: false
      description: Filter status fasilitas admin.
      schema: { $ref: '#/components/schemas/FacilityStatus' }
      example: INACTIVE
    ReservationStatusQuery:
      name: status
      in: query
      required: false
      description: Filter status reservasi milik user.
      schema: { $ref: '#/components/schemas/ReservationStatus' }
      example: APPROVED
    ReportStatusQuery:
      name: status
      in: query
      required: false
      description: Filter status laporan milik user.
      schema: { $ref: '#/components/schemas/ReportStatus' }
      example: NEW
    ReportQueue:
      name: queue
      in: query
      required: true
      description: intake hanya NEW; work mencakup NEW dan IN_PROGRESS.
      schema: { type: string, enum: [intake, work] }
      example: work
    RoleQuery:
      name: role
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Role' }
      example: petugas
    AccountStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AccountStatus' }
      example: PENDING
    Date:
      name: date
      in: query
      required: true
      description: Tanggal kalender Asia/Jakarta dalam YYYY-MM-DD.
      schema: { type: string, format: date }
      example: '2026-09-15'
    DateFrom:
      name: dateFrom
      in: query
      required: true
      description: Batas awal inklusif kalender Asia/Jakarta.
      schema: { type: string, format: date }
      example: '2026-09-01'
    DateTo:
      name: dateTo
      in: query
      required: true
      description: Batas akhir inklusif kalender Asia/Jakarta; harus tidak sebelum dateFrom.
      schema: { type: string, format: date }
      example: '2026-09-30'
    ExportFormat:
      name: format
      in: query
      required: true
      description: Format file ekspor.
      schema: { type: string, enum: [csv, xlsx, pdf] }
      example: csv
    FacilityId:
      name: facilityId
      in: path
      required: true
      description: Identifier fasilitas positif.
      schema: { type: integer, minimum: 1 }
      example: 1
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Identifier reservasi positif.
      schema: { type: integer, minimum: 1 }
      example: 91
    ReportId:
      name: reportId
      in: path
      required: true
      description: Identifier laporan positif.
      schema: { type: integer, minimum: 1 }
      example: 15
    UserId:
      name: userId
      in: path
      required: true
      description: Identifier user positif.
      schema: { type: integer, minimum: 1 }
      example: 42
  headers:
    SessionCookie:
      description: Cookie ruvana_session yang HttpOnly, SameSite=Lax, Secure di production, Path=/ dan memiliki expiry dengan lifetime bounded yang dikonfigurasi implementasi (durasi tidak ditetapkan oleh kontrak ini).
      schema: { type: string }
    ExpiredSessionCookie:
      description: Cookie ruvana_session yang dihapus dengan Max-Age=0 dan expiry lampau.
      schema: { type: string }
    NoStore:
      description: Respons tidak boleh disimpan oleh browser, proxy, atau CDN.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Jumlah detik minimum sebelum request boleh dicoba lagi.
      schema: { type: integer, minimum: 1 }
      example: 900
    ExportContentDisposition:
      description: Attachment filename memuat dateFrom dan dateTo.
      schema: { type: string }
      example: attachment; filename="ruvana-analytics-2026-09-01-2026-09-30.csv"
  responses:
    BadRequest:
      description: JSON atau parameter query/path malformed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/bad-request
            title: Permintaan tidak valid
            status: 400
            detail: JSON atau parameter tidak dapat diproses.
            instance: /api/resource
            code: BAD_REQUEST
    Unauthorized:
      description: Sesi hilang, tidak valid, kedaluwarsa, atau user tidak ACTIVE. Respons tidak membocorkan penyebab akun.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/unauthorized
            title: Autentikasi diperlukan
            status: 401
            detail: Sesi tidak valid atau akun tidak aktif.
            instance: /api/protected
            code: UNAUTHORIZED
    OriginRejected:
      $ref: '#/components/responses/MutationForbidden'
    Forbidden:
      description: ACTIVE principal dengan role yang tidak diterima untuk operasi ini menerima 403 non-CSRF dengan code FORBIDDEN.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ForbiddenProblem' }
          example:
            type: https://app.example.invalid/problems/forbidden
            title: Akses ditolak
            status: 403
            detail: Role akun tidak berwenang menjalankan operasi ini.
            instance: /api/protected
            code: FORBIDDEN
    MutationForbidden:
      description: >-
        Semua mutation 403 mencakup dua penyebab yang sengaja dibedakan oleh
         code: FORBIDDEN untuk role atau kewenangan yang tidak mencukupi,
        dan CSRF_ORIGIN_REJECTED untuk Origin missing, malformed, null, multiple,
        atau tidak cocok. Origin comparison memakai exact scheme+host+port
        terhadap allowlist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MutationForbiddenProblem' }
          examples:
            forbidden:
              value:
                type: https://app.example.invalid/problems/forbidden
                title: Akses ditolak
                status: 403
                detail: Role akun tidak berwenang menjalankan operasi ini.
                instance: /api/protected
                code: FORBIDDEN
            csrf:
              value:
                type: https://app.example.invalid/problems/csrf-origin-rejected
                title: Permintaan ditolak
                status: 403
                detail: Origin permintaan tidak diizinkan.
                instance: /api/protected
                code: CSRF_ORIGIN_REJECTED
    NotFound:
      description: Resource tidak ada atau ownership/private resource dimasking.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/not-found
            title: Resource tidak ditemukan
            status: 404
            detail: Resource yang diminta tidak ditemukan.
            instance: /api/resource/1
            code: NOT_FOUND
    IdempotencyConflict:
      description: >-
        Payload berbeda memakai identity yang sama. Identity mencakup authenticated
        principal, HTTP method/operation ID, canonical path parameters, relevant
        query, dan canonical body; retensi 24 jam. Authorization role/status dan
        ownership diperiksa sebelum lookup atau replay.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/IdempotencyConflictProblem' }
          examples:
            reservation:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/reservations
                code: IDEMPOTENCY_KEY_REUSED
            reportUpload:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/report-uploads
                code: IDEMPOTENCY_KEY_REUSED
