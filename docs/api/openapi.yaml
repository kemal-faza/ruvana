                    - { startTime: '11:00', endTime: '11:30', available: true, blockedBy: null }
                    - { startTime: '11:30', endTime: '12:00', available: true, blockedBy: null }
                    - { startTime: '12:00', endTime: '12:30', available: true, blockedBy: null }
                    - { startTime: '12:30', endTime: '13:00', available: true, blockedBy: null }
                    - { startTime: '13:00', endTime: '13:30', available: true, blockedBy: null }
                    - { startTime: '13:30', endTime: '14:00', available: true, blockedBy: null }
                    - { startTime: '14:00', endTime: '14:30', available: true, blockedBy: null }
                    - { startTime: '14:30', endTime: '15:00', available: true, blockedBy: null }
                    - { startTime: '15:00', endTime: '15:30', available: true, blockedBy: null }
                    - { startTime: '15:30', endTime: '16:00', available: true, blockedBy: null }
                    - { startTime: '16:00', endTime: '16:30', available: true, blockedBy: null }
                    - { startTime: '16:30', endTime: '17:00', available: true, blockedBy: null }
                    - { startTime: '17:00', endTime: '17:30', available: true, blockedBy: null }
                    - { startTime: '17:30', endTime: '18:00', available: true, blockedBy: null }
                    - { startTime: '18:00', endTime: '18:30', available: true, blockedBy: null }
                    - { startTime: '18:30', endTime: '19:00', available: true, blockedBy: null }
                    - { startTime: '19:00', endTime: '19:30', available: true, blockedBy: null }
                    - { startTime: '19:30', endTime: '20:00', available: true, blockedBy: null }
            stale:
              value:
                type: https://app.example.invalid/problems/invalid-reservation-transition
                title: Transisi reservasi tidak valid
                status: 409
                detail: Reservasi sudah diproses atau tidak lagi berstatus PENDING.
                instance: /api/staff/reservations/91/approve
                code: INVALID_RESERVATION_TRANSITION
    ReservationActionConflict:
      description: Alternatif tertutup untuk transisi reservasi stale atau idempotency mismatch.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ReservationTransitionProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            stale:
              value:
                type: https://app.example.invalid/problems/invalid-reservation-transition
                title: Transisi reservasi tidak valid
                status: 409
                detail: Reservasi tidak berada pada status yang dapat dibatalkan.
                instance: /api/staff/reservations/91/reject
                code: INVALID_RESERVATION_TRANSITION
            idempotency:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/reservations/91/cancel
                code: IDEMPOTENCY_KEY_REUSED
    ReportTransitionConflict:
      description: Transisi laporan ditolak oleh state machine atau target sudah stale/expired.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ReportTransitionProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            stale:
              value:
                type: https://app.example.invalid/problems/invalid-report-transition
                title: Transisi laporan tidak valid
                status: 409
                detail: Laporan sudah berada pada status terminal.
                instance: /api/staff/reports/15/resolve
                code: INVALID_REPORT_TRANSITION
            idempotency:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/staff/reports/15/resolve
                code: IDEMPOTENCY_KEY_REUSED
    ReportStartTransitionConflict:
      description: Transisi laporan ditolak oleh state machine atau target sudah stale/expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ReportTransitionProblem' }
          example:
            type: https://app.example.invalid/problems/invalid-report-transition
            title: Transisi laporan tidak valid
            status: 409
            detail: Laporan sudah berada pada status terminal.
            instance: /api/staff/reports/15/start
            code: INVALID_REPORT_TRANSITION
    FacilityTransitionConflict:
      description: Transisi fasilitas ditolak oleh state machine atau target sudah stale/expired.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/FacilityTransitionProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            stale:
              value:
                type: https://app.example.invalid/problems/invalid-facility-transition
                title: Transisi fasilitas tidak valid
                status: 409
                detail: Transisi status fasilitas tidak diizinkan dari status saat ini.
                instance: /api/staff/facilities/1/status
                code: INVALID_FACILITY_TRANSITION
            idempotency:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/staff/facilities/1/status
                code: IDEMPOTENCY_KEY_REUSED
    UnprocessableEntity:
      description: Input valid secara bentuk tetapi melanggar validasi field atau aturan bisnis.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/validation-failed
            title: Validasi gagal
            status: 422
            detail: Satu atau lebih field tidak memenuhi aturan.
            instance: /api/resource
            code: VALIDATION_FAILED
            errors:
              - field: startTime
                code: SLOT_ALIGNMENT_INVALID
                message: Waktu harus berada pada kelipatan 30 menit.
    LoginRateLimited:
      description: Lebih dari 10 kegagalan login dalam 2 menit untuk kombinasi IP dan email ternormalisasi.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/login-rate-limited
            title: Terlalu banyak percobaan login
            status: 429
            detail: Coba lagi setelah Retry-After detik.
            instance: /api/auth/login
            code: LOGIN_RATE_LIMITED
    UploadRateLimited:
      description: 'Batas penerbitan URL unggah terlampaui: 20 per pengguna per jam atau 60 per IP per jam. Retry-After tidak dikirim karena waktu pemulihan tiap bucket tidak dihitung oleh handler.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://ruvana.invalid/problems/upload-rate-limited
            title: Batas unggah tercapai
            status: 429
            detail: Batas penerbitan URL unggah per jam tercapai. Coba lagi nanti.
            instance: /api/reports/photo-uploads
            code: UPLOAD_RATE_LIMITED
    BlobFailure:
      description: Upstream Vercel Blob gagal atau tidak dapat diverifikasi.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/blob-upstream-failure
            title: Penyimpanan foto tidak tersedia
            status: 502
            detail: Penyimpanan foto gagal diproses; silakan coba lagi.
            instance: /api/reports/photo-uploads
            code: BLOB_UPSTREAM_FAILURE
    AdminUserMutationConflict:
      description: Email telah digunakan atau Idempotency-Key dipakai untuk payload berbeda.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/AdminUserEmailConflictProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            email:
              value:
                type: https://app.example.invalid/problems/email-already-used
                title: Email sudah digunakan
                status: 409
                detail: Email siti.aminah@example.com sudah terdaftar.
                instance: /api/admin/users
                code: EMAIL_ALREADY_USED
            idempotency:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/admin/users
                code: IDEMPOTENCY_KEY_REUSED
    FacilityMutationConflict:
      description: Nama fasilitas, transisi status, atau Idempotency-Key menimbulkan konflik.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/FacilityMutationProblem'
              - $ref: '#/components/schemas/FacilityTransitionProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            name:
              value:
                type: https://app.example.invalid/problems/facility-name-already-used
                title: Nama fasilitas sudah digunakan
                status: 409
                detail: Nama fasilitas RK-101 harus unik.
                instance: /api/admin/facilities
                code: FACILITY_NAME_ALREADY_USED
            transition:
              value:
                type: https://app.example.invalid/problems/invalid-facility-transition
                title: Transisi fasilitas tidak valid
                status: 409
                detail: Transisi status fasilitas tidak diizinkan dari status saat ini.
                instance: /api/admin/facilities/1
                code: INVALID_FACILITY_TRANSITION
            idempotency:
              value:
                type: https://app.example.invalid/problems/idempotency-key-reused
                title: Idempotensi tidak cocok
                status: 409
                detail: Idempotency-Key telah digunakan untuk payload berbeda pada identity yang sama.
                instance: /api/admin/facilities/1
                code: IDEMPOTENCY_KEY_REUSED
    InternalServerError:
      description: Kesalahan tak terduga; detail internal dicatat server dan tidak dikirim ke client.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/internal-error
            title: Kesalahan internal
            status: 500
            detail: Terjadi kesalahan yang tidak terduga.
            instance: /api/resource
            code: INTERNAL_ERROR
  schemas:
    Role:
      type: string
      enum: [pengguna, petugas, admin]
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, DISABLED]
    FacilityType:
      type: string
      enum: [ruang_kelas, aula, laboratorium, alat, lapangan]
    FacilityStatus:
      type: string
      enum: [ACTIVE, UNDER_MAINTENANCE, INACTIVE]
    PublicFacilityStatus:
      type: string
      enum: [ACTIVE, UNDER_MAINTENANCE]
    ReservationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED_BY_USER, CANCELLED_BY_OFFICER, CANCELLED_BY_MAINTENANCE, EXPIRED]
    ReportStatus:
      type: string
      enum: [NEW, IN_PROGRESS, RESOLVED, REJECTED]
    ReportCategory:
      type: string
      enum: [Listrik, Peralatan, Furnitur, Bangunan, Kebersihan, Lainnya]
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: Instant ISO 8601 canonical UTC; wajib memiliki trailing Z, bukan offset lokal atau offset numerik. Untuk expiry reservasi, server menetapkan EXPIRED ketika serverNow >= startsAt.
    ReservationStartTime:
      type: string
      enum: ['07:00', '07:30', '08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30']
      description: Waktu mulai lokal Asia/Jakarta yang valid setiap 30 menit dari 07:00 sampai 19:30.
    ReservationEndTime:
      type: string
      enum: ['07:30', '08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00']
      description: Waktu selesai lokal Asia/Jakarta yang valid setiap 30 menit dari 07:30 sampai 20:00.
    SafeUser:
      type: object
      additionalProperties: false
      required: [id, nama, email, role, status, waktuDaftar, waktuVerifikasi]
      properties:
        id: { type: integer, minimum: 1, readOnly: true }
        nama: { type: string, minLength: 1, maxLength: 100, readOnly: true }
        email: { type: string, format: email, maxLength: 254, readOnly: true }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        waktuDaftar: { $ref: '#/components/schemas/UtcInstant', readOnly: true }
        waktuVerifikasi:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          readOnly: true
    StaffUser:
      type: object
      additionalProperties: false
      required: [id, nama, role]
      properties:
        id: { type: integer, minimum: 1, readOnly: true }
        nama: { type: string, minLength: 1, maxLength: 100, readOnly: true }
        role: { type: string, enum: [petugas, admin], readOnly: true }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [nama, email, password]
      properties:
        nama: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72, description: 'Server dan client wajib menegakkan 8–72 byte UTF-8; minLength/maxLength hanya batas aman karakter, bukan aturan otoritatif byte.' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72, description: 'Verifikasi server dan client memakai password 8–72 byte UTF-8; minLength/maxLength hanya batas aman karakter, bukan aturan otoritatif byte.' }
    AdminCreateUserRequest:
      type: object
      additionalProperties: false
      required: [nama, email, password, role]
      properties:
        nama: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72, description: 'Server dan client wajib menegakkan 8–72 byte UTF-8; minLength/maxLength hanya batas aman karakter, bukan aturan otoritatif byte.' }
        role: { type: string, enum: [pengguna, petugas] }
    FacilityCreateRequest:
      type: object
      additionalProperties: false
      required: [nama, tipe, lokasi, kapasitas]
      properties:
