                status: 409
                detail: Reservasi sudah diproses atau tidak lagi berstatus PENDING.
                instance: /api/staff/reservations/91/approve
                code: INVALID_RESERVATION_TRANSITION
    ReservationActionConflict:
      description: Alternatif tertutup untuk transisi reservasi stale atau idempotency mismatch.
