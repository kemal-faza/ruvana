      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [status, code]
          properties:
            status: { type: integer, const: 409 }
            code: { type: string, const: UPLOAD_ALREADY_FINALIZED }
      unevaluatedProperties: false
    AccountTransitionProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [status, code]
          properties:
             status: { type: integer, const: 409 }
             code: { type: string, const: INVALID_ACCOUNT_TRANSITION }
      unevaluatedProperties: false
    AdminUserEmailConflictProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [status, code]
          properties:
            status: { type: integer, const: 409 }
            code: { type: string, const: EMAIL_ALREADY_USED }
      unevaluatedProperties: false
    FacilityTransitionProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [status, code]
          properties:
            status: { type: integer, const: 409 }
            code: { type: string, const: INVALID_FACILITY_TRANSITION }
      unevaluatedProperties: false
    FacilityMutationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [status, code]
          properties:
            status: { type: integer, const: 409 }
            code: { type: string, const: FACILITY_NAME_ALREADY_USED }
      unevaluatedProperties: false
    DamageGroup:
      type: object
      additionalProperties: false
      required: [facilityId, facilityName, kategori, status, count]
      properties:
        facilityId: { type: integer, minimum: 1 }
        facilityName: { type: string }
        kategori: { $ref: '#/components/schemas/ReportCategory' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        count: { type: integer, minimum: 0 }
    Analytics:
      type: object
      additionalProperties: false
      required: [filter, timezone, effectiveRange, generatedAt, occupancy, damageGroups, methodology]
      properties:
        filter:
          type: object
          additionalProperties: false
          required: [dateFrom, dateTo, location]
          properties:
            dateFrom: { type: string, format: date }
            dateTo: { type: string, format: date }
            location:
              type: [string, 'null']
              maxLength: 200
              description: >-
                Requested/effective location; null means all locations. Matching is
                trim + case-fold + exact, case-insensitive.
        timezone: { type: string, const: Asia/Jakarta }
        effectiveRange:
          type: object
          additionalProperties: false
          required: [from, until]
          properties:
            from: { $ref: '#/components/schemas/UtcInstant', description: 00:00 dateFrom Asia/Jakarta sebagai UTC. }
            until: { $ref: '#/components/schemas/UtcInstant', description: 00:00 sehari setelah dateTo Asia/Jakarta sebagai UTC; batas exclusive. }
        generatedAt: { $ref: '#/components/schemas/UtcInstant', readOnly: true, description: Waktu server saat dataset dashboard/export yang sama dibuat. }
        occupancy:
          type: object
          additionalProperties: false
          required: [numeratorMinutes, denominatorMinutes, percentage]
          properties:
            numeratorMinutes: { type: integer, minimum: 0, description: Total menit irisan reservasi APPROVED. }
            denominatorMinutes: { type: integer, minimum: 0, description: 'Setiap fasilitas yang cocok dengan location ternormalisasi, tanpa mengecualikan ACTIVE, UNDER_MAINTENANCE, atau INACTIVE, × hari kalender × 780; status historis tidak direkonstruksi.' }
            percentage: { type: number, minimum: 0, maximum: 100 }
        damageGroups:
          type: array
          items: { $ref: '#/components/schemas/DamageGroup' }
        methodology:
          type: object
          additionalProperties: false
          required: [operatingMinutesPerDay, approvedOnly, maintenanceExcludedFromDenominator, damageCountedFrom]
          properties:
            operatingMinutesPerDay: { type: integer, const: 780 }
            approvedOnly: { type: boolean, const: true }
            maintenanceExcludedFromDenominator: { type: boolean, const: false }
            damageCountedFrom: { type: string, const: createdAt }
