  /api/reservations:
    get:
      operationId: listMyReservations
      tags: [Reservations]
      summary: Menampilkan riwayat reservasi pengguna
      description: Hanya role=pengguna dengan status=ACTIVE yang diterima dan hanya reservasi miliknya yang dikembalikan. Akun non-ACTIVE menghasilkan 401 generik; principal ACTIVE dengan role berbeda menghasilkan 403. Urutan deterministik createdAt DESC lalu id DESC. Expiry target dijalankan sebelum operasi terkait.
      x-requirement-ids: [RES-03, RES-08, IAM-03]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Riwayat reservasi, termasuk keadaan kosong.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationCollection' }
              example:
                items:
                  - id: 91
                    facility:
                      id: 1
                      nama: RK-101
                      tipe: ruang_kelas
                      lokasi: Gedung A Lt.1
                      kapasitas: 40
                      deskripsi: Ruang kelas standar ber-AC
                      status: ACTIVE
                    date: '2026-09-15'
                    timezone: Asia/Jakarta
                    startTime: '09:00'
                    endTime: '10:00'
                    startsAt: '2026-09-15T02:00:00Z'
                    endsAt: '2026-09-15T03:00:00Z'
                    tujuanPenggunaan: Diskusi kelompok
                    status: APPROVED
                    alasan: null
                    submittedAt: '2026-09-09T03:00:00Z'
                    processedAt: '2026-09-09T04:00:00Z'
                    processedBy: { id: 7, nama: Petugas Ruvana, role: petugas }
                meta: { page: 1, perPage: 20, totalItems: 1, totalPages: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createReservation
      tags: [Reservations]
      summary: Mengajukan reservasi fasilitas
      description: Hanya role=pengguna dengan status=ACTIVE yang dapat membuat satu reservasi PENDING; akun non-ACTIVE menghasilkan 401 generik, sedangkan ACTIVE principal dengan role berbeda menghasilkan 403. date, startTime, dan endTime adalah waktu lokal Asia/Jakarta; slot harus berurutan pada kelipatan 30 menit dalam 07:00–20:00. Tanggal lampau, slot yang sudah mulai, fasilitas tidak tersedia, dan konflik APPROVED ditolak. PENDING lain tidak dianggap konflik. Relasi endTime > startTime dan pemeriksaan current server time tetap wajib di server.
      x-requirement-ids: [RES-01, RES-02, IAM-03]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreateRequest' }
            example:
              facilityId: 1
              date: '2026-09-15'
              startTime: '09:00'
              endTime: '10:00'
              tujuanPenggunaan: Diskusi kelompok
      responses:
        '201':
          description: Reservasi PENDING dibuat; submittedAt dan instant UTC dibuat server.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                id: 92
                facility:
                  id: 1
                  nama: RK-101
                  tipe: ruang_kelas
                  lokasi: Gedung A Lt.1
                  kapasitas: 40
                  deskripsi: Ruang kelas standar ber-AC
                  status: ACTIVE
                date: '2026-09-15'
                timezone: Asia/Jakarta
                startTime: '09:00'
                endTime: '10:00'
                startsAt: '2026-09-15T02:00:00Z'
                endsAt: '2026-09-15T03:00:00Z'
                tujuanPenggunaan: Diskusi kelompok
                status: PENDING
                alasan: null
                submittedAt: '2026-09-09T03:20:00Z'
                processedAt: null
                processedBy: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '409':
          description: Alternatif tertutup untuk overlap/approval, transisi reservasi basi, atau idempotency mismatch.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ReservationConflictProblem'
                  - $ref: '#/components/schemas/ReservationTransitionProblem'
                  - $ref: '#/components/schemas/IdempotencyConflictProblem'
              examples:
                overlap:
                  value:
                    type: https://app.example.invalid/problems/reservation-overlap
                    title: Reservasi bertabrakan
                    status: 409
                    detail: Slot bertabrakan dengan reservasi yang telah disetujui.
                    instance: /api/reservations
                    code: RESERVATION_OVERLAP
                    availability:
                      facilityId: 1
                      date: '2026-09-15'
                      timezone: Asia/Jakarta
                      slots:
                        - { startTime: '07:00', endTime: '07:30', available: true, blockedBy: null }
                        - { startTime: '07:30', endTime: '08:00', available: true, blockedBy: null }
                        - { startTime: '08:00', endTime: '08:30', available: true, blockedBy: null }
                        - { startTime: '08:30', endTime: '09:00', available: true, blockedBy: null }
                        - { startTime: '09:00', endTime: '09:30', available: false, blockedBy: APPROVED }
                        - { startTime: '09:30', endTime: '10:00', available: false, blockedBy: APPROVED }
                        - { startTime: '10:00', endTime: '10:30', available: true, blockedBy: null }
                        - { startTime: '10:30', endTime: '11:00', available: true, blockedBy: null }
                        - { startTime: '11:00', endTime: '11:30', available: true, blockedBy: null }
