  /api/staff/facilities/{facilityId}/status:
    patch:
      operationId: updateFacilityOperationalStatus
      tags: [Staff]
      summary: Mengubah status operasional fasilitas
      description: >-
        Hanya role=petugas atau role=admin dengan status=ACTIVE yang diterima; akun
        non-ACTIVE menghasilkan 401 generik, sedangkan principal ACTIVE dengan role
        berbeda menghasilkan 403. Jalur petugas/admin ini hanya menerima matriks
        ACTIVE -> UNDER_MAINTENANCE dan UNDER_MAINTENANCE -> ACTIVE; INACTIVE
        tidak pernah menjadi asal atau tujuan. Hanya destination UNDER_MAINTENANCE
        yang memanggil REP-04/RES-09 dalam satu transaksi PostgreSQL all-or-nothing:
        simpan status, actor terbaru, dan satu statusChangedAt server bersama, lalu
        batalkan tepat reservasi APPROVED pada facility ini dengan startsAt >
        statusChangedAt dan alasan user-visible otomatis. Retry idempotent; reservation
         lampau dan facility lain terlindungi. Kegagalan salah satu efek me-roll back
         seluruh perubahan; kembali ke ACTIVE menghitung ulang availability dari
         APPROVED terkini. Untuk setiap perubahan status, sebelum mengembalikan 200
         server wajib invalidate seluruh representasi public list/detail/availability
         yang terdampak; client wajib refetch representasi tersebut.
      x-requirement-ids: [REP-04, RES-09, FAC-04, IAM-03]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffFacilityStatusRequest' }
            example: { status: UNDER_MAINTENANCE }
      responses:
        '200':
          description: Fasilitas terbaru setelah seluruh efek maintenance tersimpan konsisten; seluruh representasi public list/detail/availability yang terdampak telah di-invalidate sebelum 200 dikembalikan.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
              example:
                id: 1
                nama: RK-101
                tipe: ruang_kelas
                lokasi: Gedung A Lt.1
                kapasitas: 40
                deskripsi: Ruang kelas standar ber-AC
                status: UNDER_MAINTENANCE
                statusChangedAt: '2026-09-09T05:00:00Z'
                statusChangedBy: { id: 7, nama: Petugas Ruvana, role: petugas }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MutationForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FacilityTransitionConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
