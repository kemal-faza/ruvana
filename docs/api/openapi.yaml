openapi: 3.1.2
info:
  title: Kontrak HTTP Ruvana
  version: 1.0.0
  description: |
    Kontrak HTTP untuk aplikasi reservasi dan pelaporan fasilitas kampus Ruvana.
    Semua tanggal kalender bisnis dimaknai dalam zona waktu Asia/Jakarta.
    Semua instant pada respons menggunakan UTC dan wajib berakhiran Z. Operasi
    yang memakai sesi memuat user terbaru dan hanya menerima akun berstatus
     ACTIVE. Akun non-ACTIVE selalu menghasilkan 401 generik; hanya principal
     ACTIVE dengan role yang tidak diterima yang menghasilkan 403. Authorization
     selalu dievaluasi sebelum lookup atau replay idempotensi. Untuk operasi yang
     mendeklarasikan Idempotency-Key, urutannya wajib ketat: authenticate ->
     verifikasi akun ACTIVE dan otorisasi role -> verifikasi ownership bila
     berlaku -> validasi Origin -> lookup/storage idempotensi -> operasi bisnis.
     Field lifecycle nullable pada Reservation, Report, dan
    Analytics selalu dikirim dengan nilai null ketika belum berlaku; field lain
    tidak boleh berganti antara omission dan null. Request field opsional boleh
    dihilangkan; nilai null hanya diterima bila schema menyatakannya dan berarti
    mengosongkan nilai (misalnya FacilityUpdateRequest.deskripsi). Origin wajib
    hadir tepat satu kali dan dibandingkan dengan scheme+host+port secara exact
     terhadap allowlist konfigurasi; missing, malformed, null, dan multiple Origin
    values selalu ditolak. Idempotency berlaku hanya untuk operasi yang
    mendeklarasikan header tersebut, yaitu mutasi dengan body:
    createReservation, cancelMyReservation, rejectReservation, cancelReservationByOfficer,
    resolveStaffReport, rejectStaffReport, updateFacilityOperationalStatus,
    createAdminManagedUser, createFacility, dan updateFacility. Identity adalah
    authenticated principal + method/operation + canonical path parameters +
    relevant query + canonical body. Hanya hasil deterministik yang secara
    eksplisit didokumentasikan oleh operasi tersebut yang boleh disimpan atau
    di-replay; 401 dan 403 tidak pernah disimpan atau di-replay, dan Origin yang
    ditolak tidak mengonsumsi atau meracuni key sehingga request CSRF yang telah
    dikoreksi dapat diproses. Hasil sukses 200/201/204 dan 4xx deterministik
    yang didokumentasikan dapat disimpan; 5xx, 429, 502, dan 503 tidak disimpan.
    Key/payload sama menunggu dan mengembalikan hasil pertama, payload berbeda
    menghasilkan 409, dan scope path mencegah replay lintas resource.
  contact:
    name: Tim Ruvana
  license:
    name: Dokumentasi proyek internal Ruvana
    identifier: NOASSERTION
servers:
  - url: https://{appHost}
    description: Host aplikasi dari konfigurasi deployment; default aman bukan hostname produksi.
    variables:
      appHost:
        default: app.example.invalid
        description: Host deployment yang diizinkan oleh konfigurasi; production wajib mengganti nilai ini.
  - url: http://127.0.0.1:3000
    description: Lokal
tags:
  - name: Authentication
    description: Registrasi dan sesi pengguna.
  - name: Facilities
    description: Discovery fasilitas dan ketersediaan publik.
  - name: Reservations
    description: Reservasi milik pengguna.
  - name: Reports
    description: Upload foto dan laporan kerusakan milik pengguna.
  - name: Staff
    description: Antrean operasional dan transisi petugas.
  - name: Administration
    description: Pengelolaan akun dan fasilitas oleh admin.
  - name: Analytics
    description: Dashboard rekap dan ekspor admin.
security:
  - cookieAuth: []
paths:
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Mendaftarkan akun pengguna
      description: Membuat akun role pengguna berstatus PENDING. Email dinormalisasi dan password tidak pernah dikembalikan. Origin yang hilang, malformed, null, atau dikirim lebih dari sekali ditolak.
      x-requirement-ids: [IAM-01, IAM-03]
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nama: Siti Aminah
              email: siti.aminah@example.com
              password: RahasiaKuat123!
      responses:
        '201':
          description: Akun PENDING berhasil dibuat; respons PII tidak boleh di-cache.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
              example:
                user:
                  id: 42
                  nama: Siti Aminah
                  email: siti.aminah@example.com
                  role: pengguna
                  status: PENDING
                  waktuDaftar: '2026-09-09T03:15:00Z'
                  waktuVerifikasi: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403': { $ref: '#/components/responses/MutationForbidden' }
        '409':
          description: Email telah digunakan.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://app.example.invalid/problems/email-already-used
                title: Konflik data
                status: 409
                detail: Email tersebut sudah terdaftar.
                instance: /api/auth/register
                code: EMAIL_ALREADY_USED
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      summary: Memulai sesi pengguna
      description: Hanya akun ACTIVE yang dapat login. Semua kegagalan kredensial, email tidak ada, dan status akun memakai respons generik 401. Kegagalan dihitung atomik per IP dan email ternormalisasi, maksimum 10 dalam 2 menit. Origin yang hilang, malformed, null, atau dikirim lebih dari sekali ditolak.
      x-requirement-ids: [IAM-02, IAM-03]
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: siti.aminah@example.com
              password: RahasiaKuat123!
      responses:
        '200':
          description: Sesi persisten berhasil dibuat. Server mengirim cookie HttpOnly, SameSite=Lax, Secure di production, Path=/, expiry, dan kontrak renewal bounded yang dikonfigurasi implementasi. Respons PII tidak boleh di-cache.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                user:
                  id: 42
                  nama: Siti Aminah
                  email: siti.aminah@example.com
                  role: pengguna
                  status: ACTIVE
                  waktuDaftar: '2026-09-01T02:00:00Z'
                  waktuVerifikasi: '2026-09-02T04:00:00Z'
                expiresAt: '2026-09-16T03:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Kredensial atau status akun tidak valid; respons tidak membedakan penyebab.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://app.example.invalid/problems/invalid-credentials
                title: Autentikasi gagal
                status: 401
                detail: Email atau password tidak valid.
                instance: /api/auth/login
                code: INVALID_CREDENTIALS
        '403': { $ref: '#/components/responses/MutationForbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      operationId: logoutUser
      tags: [Authentication]
      summary: Mengakhiri sesi pengguna
      description: Role yang diterima tepat pengguna, petugas, atau admin, semuanya wajib ACTIVE; user terbaru wajib dimuat sebelum sesi persisten di server diakhiri dan cookie sesi dihapus. Respons tidak boleh di-cache.
      x-requirement-ids: [IAM-02, IAM-03]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Sesi diakhiri dan cookie dihapus dengan Max-Age=0 serta expiry lampau; respons tidak boleh di-cache.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ExpiredSessionCookie'
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/MutationForbidden' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Membaca pengguna sesi saat ini
      description: Sesi dengan role pengguna, petugas, atau admin yang berstatus ACTIVE dapat membaca user terbaru; sesi hilang, kedaluwarsa, atau akun selain ACTIVE menghasilkan 401 generik. Respons PII tidak boleh di-cache.
      x-requirement-ids: [IAM-03]
      security:
        - cookieAuth: []
      parameters: []
      responses:
        '200':
          description: User aman tanpa password hash atau rahasia sesi; respons tidak boleh di-cache.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
               schema: { $ref: '#/components/schemas/AuthUserResponse' }
               example:
                 user:
                  id: 7
                  nama: Budi Santoso
                  email: budi@example.com
                  role: petugas
                  status: ACTIVE
                  waktuDaftar: '2026-08-20T02:00:00Z'
                  waktuVerifikasi: '2026-08-20T03:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/facilities:
    get:
      operationId: listPublicFacilities
      tags: [Facilities]
      summary: Menampilkan daftar fasilitas publik
      description: Mengembalikan fasilitas ACTIVE dan UNDER_MAINTENANCE tanpa actor atau waktu perubahan status. Filter search, type, location, dan minCapacity digabungkan dengan logika AND. Urutan default id ASC.
      x-requirement-ids: [FAC-01, FAC-03, FAC-04]
      security: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FacilityTypeQuery'
        - $ref: '#/components/parameters/PublicLocation'
        - $ref: '#/components/parameters/MinCapacity'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: >-
            Halaman fasilitas publik, termasuk keadaan kosong yang valid.
            Freshness policy bersifat no-store: server mengirim
            Cache-Control: no-store dan client wajib refetch list, detail, dan
            availability setelah menerima hasil mutasi status fasilitas.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFacilityCollection' }
              example:
                items:
                  - id: 1
                    nama: RK-101
                    tipe: ruang_kelas
                    lokasi: Gedung A Lt.1
                    kapasitas: 40
                    deskripsi: Ruang kelas standar ber-AC
                    status: ACTIVE
                meta: { page: 1, perPage: 20, totalItems: 1, totalPages: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/facilities/{facilityId}:
    get:
      operationId: getPublicFacility
      tags: [Facilities]
      summary: Menampilkan detail fasilitas publik
      description: Fasilitas INACTIVE dimasking sebagai not found yang sama dengan identifier yang tidak ada. Respons publik tidak pernah memuat actor atau waktu perubahan status.
      x-requirement-ids: [FAC-01, FAC-04]
      security: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: >-
            Detail fasilitas publik. Freshness policy bersifat no-store: server
            mengirim Cache-Control: no-store dan client wajib refetch setelah
            menerima hasil mutasi status fasilitas.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFacility' }
              example:
                id: 3
                nama: Aula Utama
                tipe: aula
                lokasi: Gedung Serbaguna
                kapasitas: 300
                deskripsi: Aula serbaguna dengan panggung
                status: UNDER_MAINTENANCE
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/facilities/{facilityId}/availability:
    get:
      operationId: getFacilityAvailability
      tags: [Facilities]
      summary: Memeriksa ketersediaan slot fasilitas
      description: >-
        Mengembalikan tepat 26 slot untuk tanggal kalender Asia/Jakarta. Reservasi
        PENDING tidak memblokir; maintenance membuat seluruh slot tidak tersedia.
        Pemesan dan tujuan tidak pernah dibocorkan. Fasilitas INACTIVE dimasking
        persis seperti fasilitas yang tidak ada: status 404, payload NotFound yang
        identik, dan kebijakan timing yang identik tanpa side-channel.
      x-requirement-ids: [FAC-02, FAC-04]
      security: []
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: >-
            Grid 26 slot lokal untuk tanggal yang dipilih. Freshness policy
            bersifat no-store: server mengirim Cache-Control: no-store dan
            client wajib refetch setelah menerima hasil mutasi status fasilitas.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
              example:
                facilityId: 1
                date: '2026-09-15'
                timezone: Asia/Jakarta
                slots:
                  - startTime: '07:00'
                    endTime: '07:30'
                    available: true
                    blockedBy: null
                  - startTime: '07:30'
                    endTime: '08:00'
