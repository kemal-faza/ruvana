                    - { startTime: '11:30', endTime: '12:00', available: true, blockedBy: null }
                    - { startTime: '12:00', endTime: '12:30', available: true, blockedBy: null }
                    - { startTime: '12:30', endTime: '13:00', available: true, blockedBy: null }
                    - { startTime: '13:00', endTime: '13:30', available: true, blockedBy: null }
                    - { startTime: '13:30', endTime: '14:00', available: true, blockedBy: null }
                    - { startTime: '14:00', endTime: '14:30', available: true, blockedBy: null }
                    - { startTime: '14:30', endTime: '15:00', available: true, blockedBy: null }
                    - { startTime: '15:00', endTime: '15:30', available: true, blockedBy: null }
                    - { startTime: '15:30', endTime: '16:00', available: true, blockedBy: null }
                    - { startTime: '16:00', endTime: '16:30', available: true, blockedBy: null }
                    - { startTime: '16:30', endTime: '17:00', available: true, blockedBy: null }
                    - { startTime: '17:00', endTime: '17:30', available: true, blockedBy: null }
                    - { startTime: '17:30', endTime: '18:00', available: true, blockedBy: null }
