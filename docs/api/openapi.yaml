    UnprocessableEntity:
      description: Input valid secara bentuk tetapi melanggar validasi field atau aturan bisnis.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/validation-failed
            title: Validasi gagal
            status: 422
            detail: Satu atau lebih field tidak memenuhi aturan.
            instance: /api/resource
            code: VALIDATION_FAILED
            errors:
              - field: startTime
                code: SLOT_ALIGNMENT_INVALID
                message: Waktu harus berada pada kelipatan 30 menit.
    LoginRateLimited:
      description: Lebih dari 10 kegagalan login dalam 15 menit untuk kombinasi IP dan email ternormalisasi.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/login-rate-limited
            title: Terlalu banyak percobaan login
            status: 429
            detail: Coba lagi setelah Retry-After detik.
            instance: /api/auth/login
            code: LOGIN_RATE_LIMITED
    UploadRateLimited:
      description: 'Batas upload intent terlampaui: 20 per user per jam atau 60 per IP per jam.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://app.example.invalid/problems/upload-rate-limited
            title: Batas upload tercapai
