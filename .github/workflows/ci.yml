name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Client Prisma tidak di-commit (generated/ di-gitignore) dan
      # tidak ada di lockfile, jadi wajib di-generate sebelum typecheck/build.
      # prisma.config.ts (Prisma 7) memuat env("DATABASE_URL") saat config di-load,
      # jadi DATABASE_URL dummy harus tersedia di env — generate tidak menyentuh DB.
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: mysql://ruvana:ruvana_pass@localhost:3306/ruvana

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          # Build halaman statis (belum ada data fetching) — tidak butuh DB.
          DATABASE_URL: mysql://ruvana:ruvana_pass@localhost:3306/ruvana
          NEXT_TELEMETRY_DISABLED: "1"
