name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruvana
          POSTGRES_PASSWORD: ruvana_pass
          POSTGRES_DB: ruvana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruvana -d ruvana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.30.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Client Prisma tidak di-commit (generated/ di-gitignore) dan
      # tidak ada di lockfile, jadi wajib di-generate sebelum typecheck/build.
      # prisma.config.ts (Prisma 7) memuat env("DATABASE_URL") saat config di-load,
      # jadi DATABASE_URL dummy harus tersedia di env — generate tidak menyentuh DB.
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://ruvana:ruvana_pass@localhost:5432/ruvana

      - name: Lint
        run: pnpm lint

      # Pengecekan kata terlarang (AI-trap words dari PDF Project PPK 2026).
      # Lapisan kedua setelah pre-commit hook — melindungi dari commit --no-verify.
      - name: Cek kata terlarang
        run: pnpm check:banned

      - name: Cek kesesuaian path OpenAPI
        run: pnpm check:openapi-paths

      # Route types (mis. global LayoutProps di app/layout.tsx) baru tersedia
      # setelah `next typegen`. tsc --noEmit harus jalan SETELAH typegen,
      # jika tidak akan error "Cannot find name 'LayoutProps'".
      # Referensi: https://nextjs.org/docs/app/api-reference/cli/next#next-typegen-options
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Test suite unit vitest (36 file co-located, 154 tes). Urutan ini
      # mengikuti docs/PRD.md: "... TypeScript, test suite, dan build".
      # DATABASE_URL dummy disediakan agar konsisten dengan step lain;
      # seluruh tes ini mem-mock lapisan DB dan tidak menyentuh PostgreSQL.
      - name: Test suite
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ruvana:ruvana_pass@localhost:5432/ruvana

      - name: Build
        run: pnpm build
        env:
          # Build halaman statis (belum ada data fetching) — tidak butuh DB.
          DATABASE_URL: postgresql://ruvana:ruvana_pass@localhost:5432/ruvana
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Migrasi dan seed database tes
        run: |
          pnpm prisma migrate deploy
          pnpm db:seed
        env:
          DATABASE_URL: postgresql://ruvana:ruvana_pass@localhost:5432/ruvana
          # Nilai unik per run; jangan simpan kata sandi demo tetap di repo.
          SEED_DEMO_PASSWORD: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}-password

      - name: HTTP guard redirects
        run: pnpm test:http-guards
        env:
          DATABASE_URL: postgresql://ruvana:ruvana_pass@localhost:5432/ruvana
